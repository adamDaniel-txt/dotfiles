# mangowm config — mirror of the dwm build in ~/.config/nixos/config/suckless/dwm
# Full option docs: https://mangowm.github.io/docs/
# Check for errors: mango -p -c ~/.config/mango/config.conf
# NOTE: no trailing # comments allowed after values — put comments on their own line.

# ---- Appearance (dwm palette: bg #282828, border #3c3836, orange #fe8019) ----
gappih=5
gappiv=5
gappoh=5
gappov=5
borderpx=5
rootcolor=0x282828ff
bordercolor=0x3c3836ff
focuscolor=0xfe8019ff
urgentcolor=0xfb4934ff
scratchpadcolor=0x458588ff

# ---- Master-Stack (dwm tile) ----
default_mfact=0.55
default_nmaster=1
new_is_master=0
smartgaps=0
scroller_structs=20
scroller_default_proportion=0.8

# ---- Animations (mangowm signature; keep default) ----
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200

# ---- Tags: 9 tags, tile default (dwm) ----
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ---- Keyboard ----
repeat_rate=35
repeat_delay=200
numlockon=0
xkb_rules_layout=us
xkb_rules_options=caps:swapescape

# ---- Trackpad (needs relogin) ----
trackpad_natural_scrolling=1

# ---- Monitor layout: HDMI above laptop (positive coords only; negatives break XWayland clicks) ----
# monitorrule=name:HDMI-A-1,x:0,y:0
# monitorrule=name:eDP-1,x:0,y:1080

# ============================================================
# Per-app rules  (ported from dwm rules[])
# ============================================================
windowrule=tags:2,appid:helium
windowrule=tags:5,appid:thunderbird
windowrule=tags:6,appid:audacity
windowrule=tags:7,appid:kdenlive
windowrule=tags:8,appid:inkscape
windowrule=tags:9,appid:gimp
windowrule=isfloating:1,appid:thunar
windowrule=isfloating:1,appid:pcmanfm
windowrule=isfloating:1,appid:mpv
windowrule=isfloating:1,appid:nsxiv
windowrule=isnamedscratchpad:1,width:0.5%,height:0.5%,appid:scratchpad
windowrule=isterm:1,appid:foot
# windowrule=isfloating:1,isterm:1,appid:foot,title:floatterm

# ============================================================
# Autostart (runs once on mango startup)
# ============================================================
exec-once=waybar
exec-once=dunst
exec-once=swaybg -i /home/fdan/.bg -m fill

# ============================================================
# Key bindings  (ported from dwm keys[]; MODKEY=SUPER, Alt=dwm Mod1)
# ============================================================
# menu / terminal / scratchpad
bind=SUPER,space,spawn,foot fsel -d
bind=SUPER,d,spawn,rofi -show drun -modi drun -line-padding 4 -hide-scrollbar -show-icons
bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,toggle_named_scratchpad,scratchpad,none,foot --app-id scratchpad
bind=SUPER,grave,spawn,dmenunicode
bind=SUPER,b,spawn,librewolf
# no togglebar dispatch: bar is waybar (hide with `killall waybar`)

# focus / master
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,i,incnmaster,+1
bind=SUPER,d,incnmaster,-1
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05
bind=SUPER,z,zoom
bind=SUPER,Tab,toggleoverview

# layouts (dwm tile / float / monocle)
bind=SUPER,t,setlayout,tile
bind=SUPER,f,toggle_all_floating
bind=SUPER+SHIFT,t,setlayout,monocle
bind=SUPER+SHIFT,space,togglefloating

# tags
bind=SUPER,0,view,0
bind=SUPER+SHIFT,0,tag,0

# monitors
bind=SUPER,comma,focusmon,left
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,period,tagmon,right
bind=SUPER,Up,focusmon,up
bind=SUPER+SHIFT,Up,tagmon,up
bind=SUPER,Down,focusmon,down
bind=SUPER+SHIFT,Down,tagmon,down

# reload config (mango default SUPER+r clashes with your qr bind)
bind=SUPER+SHIFT,r,reload_config

# app / utility launchers (scripts in ~/.config/nixos/config/scripts)
# bind=SUPER,o,spawn,tmuxdev
bind=SUPER,v,spawn,clipmenu
bind=SUPER,w,spawn,webcam
bind=SUPER,s,spawn,dmenu_websearch
bind=SUPER,p,spawn,passmenu
bind=SUPER+SHIFT,w,spawn,foot nmtui
bind=SUPER+SHIFT,l,spawn,swaylock
bind=SUPER,m,spawn,foot ncmpcpp
# bind=SUPER,r,spawn,foot qr
bind=SUPER,e,spawn,pcmanfm
# bind=SUPER,c,spawn,foot qalc
# bind=SUPER,x,spawn,foot profanity
bind=SUPER,n,spawn,foot tmux new-session nvim
# no kill-cursor equivalent on wayland (xkill dropped)
bind=SUPER+SHIFT,p,spawn,passmenu
bind=SUPER,F9,spawn,mounter
bind=SUPER,F10,spawn,unmounter
# bind=SUPER,BackSpace,spawn,sysact
bind=SUPER,p,spawn,mpc toggle
bind=SUPER,bracketleft,spawn,mpc prev
bind=SUPER,bracketright,spawn,mpc next

# tags 1-9 (dwm TAGKEYS: view / toggleview / tag / toggletag)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# ============================================================
# Mouse bindings
# ============================================================
# cursor in bottom-left corner toggles overview mode
enable_hotarea=1
# Move window with mouse
mousebind=SUPER,btn_left,moveresize,curmove

# Maximize screen with middle click
mousebind=NONE,btn_middle,togglemaximizescreen,0

# Resize window with mouse
mousebind=SUPER,btn_right,moveresize,curresize

# close / quit
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,quit

# media keys
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy -t image/png
bind=NONE,Insert,spawn_shell,wtype "$(grep -v '^#' ~/.config/nixos/config/bookmarks | dmenu -i -l 30 -p Bookmarks: | cut -d' ' -f1)"
bind=NONE,XF86AudioMute,spawn,pamixer --toggle-mute
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer --increase 5
bind=NONE,XF86AudioLowerVolume,spawn,pamixer --decrease 5
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86Display,spawn,wlr-randr --auto
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
